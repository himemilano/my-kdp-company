name: Auto KDP Business Pipeline

on:
  workflow_dispatch:

jobs:
  build-kdp-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies for ReportLab / Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main orchestration & PDF build
        run: python main.py
        env:
          GEMINI_API_KEY_MY_KDP: ${{ secrets.GEMINI_API_KEY_MY_KDP }}

      - name: Commit and push all generated KDP assets & PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "=== 🔍 Checking status before add ==="
          git status
          
          # すべての新規・変更ファイルを強制追加
          git add -A
          
          echo "=== 🔍 Checking status after add ==="
          git status
          
          # 変更がある場合のみコミット＆プッシュ
          git commit -m "✨ Auto-generated project KDP assets and PDFs via GitHub Actions [skip ci]" || echo "No changes to commit"
          git push
