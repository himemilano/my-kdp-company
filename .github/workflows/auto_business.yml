name: Auto KDP Business Pipeline

on:
  workflow_dispatch:

jobs:
  build-kdp-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main orchestration & PDF build
        run: python main.py
        env:
          GEMINI_API_KEY_MY_KDP: ${{ secrets.GEMINI_API_KEY_MY_KDP }}

      - name: Commit and push generated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "✨ Auto-generated project KDP PDFs via GitHub Actions [skip ci]"
          file_pattern: |
            active_project.json
            projects/**/output/*.pdf
            projects/**/kdp_workspace/*
