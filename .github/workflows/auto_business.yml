name: Auto KDP Business Pipeline

on:
  workflow_dispatch:

jobs:
  build-kdp-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies for ReportLab / Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run main orchestration & PDF build
        run: python main.py
        env:
          GEMINI_API_KEY_MY_KDP: ${{ secrets.GEMINI_API_KEY_MY_KDP }}

      - name: Force add and check generated files
        run: |
          echo "=== 🔍 Checking generated files ==="
          find projects/ -type f
          git status

      - name: Commit and push generated PDFs and workspace files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "✨ Auto-generated project KDP assets and PDFs via GitHub Actions [skip ci]"
          add_options: "-A"
          file_pattern: |
            active_project.json
            projects/**/output/*.pdf
            projects/**/kdp_workspace/*
            projects/**/assets/*
